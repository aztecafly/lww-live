<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Without Walls · Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --burgundy:#1211CA; --dark:#101010; --grey:#F3F4FA; --white:#FFFFFF; --pink:#FDEBC2; --soft:#3A3A3A; --ok:#1F6B4A; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--white); color:var(--dark); font-family:Montserrat, Arial, sans-serif; }
  header { border-bottom:6px solid #F9B314; background:var(--burgundy); color:var(--white); padding:16px 20px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  header b { font-family:Montserrat, Arial, sans-serif; font-size:18px; }
  header span { font-size:13px; color:var(--pink); }
  main { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
  .eyebrow { font-size:13px; font-weight:800; letter-spacing:4px; text-transform:uppercase; color:var(--burgundy); margin:0 0 8px; }
  h1 { font-family:Montserrat, Arial, sans-serif; font-size:26px; line-height:1.25; margin:0 0 20px; }
  p.hint { color:var(--soft); margin:-8px 0 16px; }
  .opt { display:block; width:100%; text-align:left; font:inherit; font-size:18px; font-weight:700; color:var(--dark);
         background:var(--grey); border:3px solid transparent; border-radius:6px; padding:18px 20px; margin:0 0 12px; cursor:pointer; }
  .opt.sel { border-color:var(--burgundy); background:var(--pink); }
  .opt:disabled { cursor:default; }
  .opt.big { text-align:center; font-size:24px; padding:26px; }
  .row { display:flex; gap:12px; }
  .row .opt { flex:1; }
  input[type=text], textarea { width:100%; font:inherit; font-size:18px; padding:16px; border:2px solid #CFC8CA; border-radius:6px; background:#fff; color:var(--dark); }
  textarea { min-height:110px; resize:vertical; }
  .btn { margin-top:12px; width:100%; font:inherit; font-size:18px; font-weight:800; color:var(--white); background:var(--burgundy);
         border:0; border-radius:6px; padding:16px; cursor:pointer; }
  .btn:disabled { opacity:.5; }
  .msg { margin-top:16px; padding:14px 16px; border-radius:6px; background:var(--grey); color:var(--dark); font-weight:700; }
  .msg.good { background:#DDEFE6; color:var(--ok); }
  .msg.bad { background:var(--pink); color:var(--burgundy); }
  .wait { text-align:center; padding:56px 8px; }
  .wait .dot { width:14px; height:14px; border-radius:50%; background:var(--burgundy); display:inline-block; margin:0 4px; animation:b 1.2s infinite ease-in-out; }
  .wait .dot:nth-child(2){animation-delay:.2s} .wait .dot:nth-child(3){animation-delay:.4s}
  @keyframes b { 0%,80%,100%{transform:scale(.5);opacity:.4} 40%{transform:scale(1);opacity:1} }
  .count { font-size:13px; color:var(--soft); margin-top:8px; text-align:right; }
  .team { font-size:13px; color:var(--pink); }
  .offline { position:fixed; bottom:12px; left:12px; right:12px; background:var(--dark); color:var(--white); padding:10px 14px; border-radius:6px; font-size:14px; display:none; }
</style>
</head>
<body>
<header><b>Learning Without Walls</b><span id="teamTag" class="team"></span></header>
<main id="app"><div class="wait"><span class="dot"></span><span class="dot"></span><span class="dot"></span><p>Connecting…</p></div></main>
<div class="offline" id="offline">Connection is slow. Keep this page open; it will catch up.</div>
<script src="activities.js"></script>
<script>
(function () {
  const A = window.ACTIVITIES, app = document.getElementById("app");
  const store = {
    get(k, d) { try { const v = localStorage.getItem("lww:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("lww:" + k, JSON.stringify(v)); } catch (e) {} }
  };
  let cid = store.get("cid", null);
  if (!cid) { cid = Array.from(crypto.getRandomValues(new Uint8Array(12)), b => (b % 36).toString(36)).join(""); store.set("cid", cid); }
  let team = store.get("team", "");
  const mine = store.get("mine", {});   // activity id -> chosen option or number of texts sent
  let state = { active: null, reveal: false }, shownKey = null, fails = 0;

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const setTeamTag = () => { const t = window.TEAMS.find(x => x.id === team); document.getElementById("teamTag").textContent = t ? "Team " + t.name : ""; };
  setTeamTag();

  async function send(act, value) {
    const r = await fetch("/api/respond", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ activity: act.id, clientId: cid, team, value, kind: act.kind, max: act.max || 1 }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "Couldn’t send. Try again.");
  }

  function waiting() {
    app.innerHTML = '<div class="wait"><span class="dot"></span><span class="dot"></span><span class="dot"></span>' +
      '<h1 style="margin-top:24px">You’re in!</h1><p class="hint" style="margin:0">Keep this page open. The next activity will appear here by itself.</p></div>';
  }

  function teamPicker(then) {
    app.innerHTML = '<p class="eyebrow">Myth or Fact? · pick your team</p><h1>Which side of the hall are you sitting on?</h1>' +
      window.TEAMS.map(t => '<button class="opt big" data-t="' + t.id + '">' + t.name + '</button>').join("");
    app.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { team = b.dataset.t; store.set("team", team); setTeamTag(); then(); });
  }

  function choice(act) {
    const picked = mine[act.id];
    const locked = act.quiz && state.reveal;
    let html = '<p class="eyebrow">' + (act.quiz ? "Myth or Fact?" : "Vote") + '</p><h1>' + esc(act.title) + '</h1>';
    const opts = act.options.map(o => '<button class="opt' + (act.quiz ? " big" : "") + (picked === o ? " sel" : "") + '" data-o="' + esc(o) + '"' + (locked ? " disabled" : "") + '>' + esc(o) + '</button>').join("");
    html += act.quiz ? '<div class="row">' + opts + '</div>' : opts;
    if (locked) {
      if (!picked) html += '<div class="msg">The answer is <b>' + esc(act.answer) + '</b>. ' + esc(act.why || "") + '</div>';
      else if (picked === act.answer) html += '<div class="msg good">Correct! It’s ' + esc(act.answer) + '. ' + esc(act.why || "") + '</div>';
      else html += '<div class="msg bad">Not this time: it’s ' + esc(act.answer) + '. ' + esc(act.why || "") + '</div>';
    } else if (picked) {
      html += '<div class="msg">' + (act.quiz ? "Answer locked in. Watch the big screen!" : "Vote recorded. You can change it while voting is open.") + '</div>';
    }
    html += '<div id="err"></div>';
    app.innerHTML = html;
    if (locked) return;
    app.querySelectorAll("[data-o]").forEach(b => b.onclick = async () => {
      const o = b.dataset.o; app.querySelectorAll(".opt").forEach(x => x.disabled = true);
      try { await send(act, o); mine[act.id] = o; store.set("mine", mine); choice(act); }
      catch (e) { app.querySelectorAll(".opt").forEach(x => x.disabled = false); document.getElementById("err").innerHTML = '<div class="msg bad">' + esc(e.message) + '</div>'; }
    });
  }

  function text(act) {
    const sent = mine[act.id] || 0, max = act.max || 1;
    let html = '<p class="eyebrow">' + (act.id === "exit" ? "Exit ticket" : act.display === "cloud" ? "Word cloud" : "Idea board") + '</p><h1>' + esc(act.title) + '</h1>';
    if (sent >= max) {
      app.innerHTML = html + '<div class="msg good">Thanks! Your answer' + (max > 1 ? "s are" : " is") + ' on the big screen.</div>';
      return;
    }
    const long = act.display !== "cloud";
    html += (act.hint ? '<p class="hint">' + esc(act.hint) + '</p>' : "") +
      (long ? '<textarea id="t" maxlength="120" placeholder="Type here"></textarea>' : '<input id="t" type="text" maxlength="40" placeholder="Type here" autocomplete="off">') +
      '<button class="btn" id="go">Send</button>' +
      (max > 1 ? '<div class="count">' + sent + ' of ' + max + ' sent</div>' : "") +
      (sent ? '<div class="msg good">Sent! Add another if you like.</div>' : "") + '<div id="err"></div>';
    app.innerHTML = html;
    const t = document.getElementById("t"), go = document.getElementById("go");
    const submit = async () => {
      const v = t.value.trim(); if (!v) return;
      go.disabled = true;
      try { await send(act, v); mine[act.id] = sent + 1; store.set("mine", mine); text(act); }
      catch (e) { go.disabled = false; document.getElementById("err").innerHTML = '<div class="msg bad">' + esc(e.message) + '</div>'; }
    };
    go.onclick = submit;
    if (!long) t.onkeydown = e => { if (e.key === "Enter") submit(); };
  }

  function render() {
    const act = A.find(a => a.id === state.active);
    if (!act) return waiting();
    if (act.quiz && !team) return teamPicker(() => render());
    return act.kind === "choice" ? choice(act) : text(act);
  }

  async function poll() {
    try {
      const r = await fetch("/api/state", { cache: "no-store" });
      if (!r.ok) throw 0;
      state = await r.json(); fails = 0; document.getElementById("offline").style.display = "none";
      const key = state.active + "|" + state.reveal;
      if (key !== shownKey) { shownKey = key; render(); }
    } catch (e) { if (++fails > 2) document.getElementById("offline").style.display = "block"; }
    setTimeout(poll, 3000 + Math.random() * 1000);
  }
  poll();
})();
</script>
</body>
</html>
